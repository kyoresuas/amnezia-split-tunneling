name: Добавить сервис
description: Сервис или домен, который должен работать напрямую
title: "[Сервис]: "
labels:
  - service
body:
  - type: input
    id: name
    attributes:
      label: Сервис
      placeholder: Например, Лента
    validations:
      required: true

  - type: textarea
    id: domains
    attributes:
      label: Домены
      description: По одному в строке. Лучше снятые из трафика приложения, а не только главная страница
      render: text
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: Уровень
      options:
        - standard
        - lite
    validations:
      required: true

  - type: input
    id: app
    attributes:
      label: Приложение
      description: Пакет и версия из RuStore, если домены снимались с приложения

  - type: textarea
    id: notes
    attributes:
      label: Заметки
      description: Собственные ASN, особенности, ссылки
