name: Ошибка
description: Файл не импортируется, формат сломан, сборка падает
title: "[Ошибка]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Что случилось
    validations:
      required: true

  - type: input
    id: file
    attributes:
      label: Файл и уровень
      placeholder: ru-lite.singbox.srs
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Клиент, версия, платформа
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Логи или сообщение об ошибке
      render: shell
